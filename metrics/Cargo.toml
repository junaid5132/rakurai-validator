[package]
name = "solana-metrics"
description = "Solana Metrics"
documentation = "https://docs.rs/solana-metrics"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[lib]
name = "solana_metrics"

[features]
agave-unstable-api = []
default = ["influxdb"]
# Enables InfluxDB (Solana) + ClickHouse (Rakurai) remote writers.
# Use `--no-default-features` for a metrics agent that only buffers / local abort dumps.
influxdb = ["dep:reqwest", "dep:clickhouse", "dep:chrono", "dep:tokio", "dep:serde"]

[dependencies]
chrono = { workspace = true, optional = true, default-features = false, features = ["clock"] }
clickhouse = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
gethostname = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls", "json"], optional = true }
serde = { workspace = true, optional = true }
solana-cluster-type = { workspace = true }
solana-sha256-hasher = { workspace = true }
solana-time-utils = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "time"] }

[dev-dependencies]
bencher = { workspace = true }
env_logger = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
solana-metrics = { path = ".", features = ["agave-unstable-api"] }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[bench]]
name = "metrics"
harness = false

[lints]
workspace = true
